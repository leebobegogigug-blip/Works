name: secretary-1

on:
  push:
    paths: ["secretary-1/**", ".github/workflows/secretary-1.yml"]
  pull_request:
    paths: ["secretary-1/**", ".github/workflows/secretary-1.yml"]

defaults:
  run:
    working-directory: secretary-1

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: UI 반영 확인
        run: python build.py --check
      - name: 단위·통합 테스트
        run: python -m unittest -v tests.test_secretary

  e2e:
    # 브라우저 E2E (가짜 LLM + Secretary–1 + Chromium). Playwright 는 테스트에만 쓰고 비서 실행에는 필요 없다
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      SHOT_DIR: shots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright 설치
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: 브라우저 E2E
        run: python tests/e2e_ui.py
      - name: 스크린샷 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: secretary-1/shots/
          if-no-files-found: ignore
