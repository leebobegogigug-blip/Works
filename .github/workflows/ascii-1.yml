name: ascii-1

on:
  push:
    paths: ["ascii-1/**", ".github/workflows/ascii-1.yml"]
  pull_request:
    paths: ["ascii-1/**", ".github/workflows/ascii-1.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # README 약속: Python 3.8+ · Windows 가 본 무대 (3.8 은 ubuntu-24.04 에 없어서 22.04)
        os: [windows-latest, ubuntu-22.04]
        python: ["3.8", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ascii-1
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 단위 테스트
        run: python -m unittest discover -s tests -v
