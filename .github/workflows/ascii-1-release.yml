name: ascii-1-release

# ascii-1/** 를 건드린 PR 마다 Windows 에서 exe 를 만들어 스모크 시험까지 돌린다 (릴리스는 하지 않는다).
# 태그 ascii-1-vX.Y.Z 를 푸시하면 같은 exe 를 GitHub Release 에 올린다 — 태그는 사람이 푸시한다.
on:
  push:
    tags: ["ascii-1-v*"]
  pull_request:
    paths: ["ascii-1/**", ".github/workflows/ascii-1-release.yml"]

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ascii-1
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 태그가 VERSION 과 맞는지 (태그로 돌 때만)
        if: startsWith(github.ref, 'refs/tags/ascii-1-v')
        run: python tools/build_exe.py --tag "${{ github.ref_name }}"
      - name: PyInstaller (버전 고정)
        run: python -m pip install pyinstaller==6.10.0
      - name: exe 만들기
        run: python tools/build_exe.py
      - name: 스모크 시험 (version · check · 변환 · 이름 충돌 · 확인 필요 · 사용법 오류)
        run: python tools/build_exe.py --smoke dist/ascii-1.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ascii-1-exe
          path: |
            ascii-1/dist/ascii-1.exe
            ascii-1/dist/ascii-1.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/ascii-1-v')
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ascii-1-exe
      - name: GitHub Release 에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          PNG 를 `ascii-1.exe` 위로 끌어다 놓으면 입력 옆에 글자 아트 `.txt` 가 생깁니다. 사용법은 저장소의 `ascii-1/docs/MANUAL.md` 에 있습니다.

          - 서명하지 않은 파일이라 Windows SmartScreen 이나 사내 백신이 막을 수 있습니다. 받은 뒤 `ascii-1.exe.sha256` 과 같은지 확인하세요: `certutil -hashfile ascii-1.exe SHA256`
          - 한 파일로 묶은 방식이라 처음 실행할 때 1–2 초 걸립니다.
          NOTES
          gh release create "$TAG" ascii-1.exe ascii-1.exe.sha256 --repo "$GITHUB_REPOSITORY" --verify-tag --title "Ascii–1 ${TAG#ascii-1-v}" --notes-file notes.md
